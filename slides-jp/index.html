### 物理のシミュレーション = 偏微分方程式を解く

<div class="simple-box">

* 流体なら**ナビエ–ストークス方程式** (非圧縮)

$$\frac{\partial \mathbf{u}}{\partial t} + (\mathbf{u} \cdot \nabla) \mathbf{u} = -\frac{1}{\rho} \nabla p + \nu \nabla^2 \mathbf{u}, \qquad \nabla \cdot \mathbf{u} = 0$$

* 電磁気はマクスウェル方程式、量子はシュレーディンガー方程式
* 空間を格子に区切り、時間を $\Delta t$ ずつ進めて数値的に解く

</div>

<div class="highlight-box">

粘性の項だけ残すと**熱方程式** $\partial u / \partial t = \alpha \nabla^2 u$ (今日解く)

</div>

Note:
非圧縮 (密度 ρ が一定)。ν は動粘性係数、α は熱拡散率。
移流項 (u·∇)u と圧力の項を落とすと、速度の各成分が拡散方程式 (熱方程式と同じ形) に従う。
熱方程式を選んだのは「答えが式で書けるので、丸め誤差だけを測れる」から (「誤差の物差し」のスライド)。

---

### 陰解法は連立一次方程式になる

<div class="results-box dense">
<table>
<tr><th>熱方程式を差分化</th><th>陽解法</th><th>陰解法</th></tr>
<tr><td>1 ステップ</td><td>$\mathbf{u}^{n+1} = (I + \alpha \Delta t L) \mathbf{u}^{n}$</td><td>$(I - \alpha \Delta t L) \mathbf{u}^{n+1} = \mathbf{u}^{n}$</td></tr>
<tr><td>計算</td><td>近くの点を足すだけ</td><td>連立一次方程式を解く</td></tr>
<tr><td>時間刻み</td><td>$\alpha \Delta t / h^2 \le 1/4$ を破ると発散<br>(格子が細かいほど厳しい)</td><td>大きくとれる</td></tr>
</table>
</div>

<div class="simple-box dense">

* $L$ は差分で書いたラプラシアン (行列)、$h$ は格子の間隔
* 流体では陽解法でも、圧力の方程式 (連立一次方程式) を毎ステップ解く

</div>

<div class="highlight-box">

物理のシミュレーションの中身は、かなりの部分が**行列の計算**

</div>

Note:
陽解法は前進オイラー、陰解法は後退オイラーの例。実験では Crank–Nicolson を x と y に分けた ADI を使う。
陽解法は「条件つき安定」。2D の 5 点差分では α Δt / h² ≤ 1/4 (今回の陽解法は 0.2 で回した)。N = 8192 では Δt = 3.0e-9 になる (Appendix)。
陰解法でも Δt を大きくすれば時間方向の誤差は増える。安定 = 発散しない、であって、正確かどうかは別。
移流項の非線形は、Newton 法などで線形化して、結局は連立一次方程式を解く (深入りしない)。
PDE から出る行列はほとんどが疎行列で、大規模なら反復法 (CG、マルチグリッド) で解く。後の「速くならないもの」につながる。

### 科学計算は FP32 では足りないことが多い

<div class="simple-box dense">

* 連立方程式の解の誤差は、目安で $\kappa$ (条件数) × $u$ (丸めの単位)
* ポアソン方程式の $\kappa$ は、格子を細かくすると $1/h^2$ に比例して大きくなる
* 長時間の積分や量子化学の自己無撞着計算でも FP64 が欲しくなる

</div>

<div class="results-box dense nowrap-table">
<table>
<tr><th>1000 × 1000 格子のポアソン方程式 ($\kappa \approx 4 \times 10^5$)</th><th>$\kappa u$</th></tr>
<tr><td>FP32 ($u \approx 6 \times 10^{-8}$)</td><td>$2 \times 10^{-2}$ (2 桁も残らない)</td></tr>
<tr><td>FP64 ($u \approx 1.1 \times 10^{-16}$)</td><td>$5 \times 10^{-11}$ (10 桁残る)</td></tr>
</table>
</div>

<div class="highlight-box">

物理のシミュレーションは FP64 が標準

</div>

Note:
κ は「入力の小さな誤差が、答えで何倍に膨らむか」。κu は後退安定な解法での目安 (上限側の見積もり) で、実際の誤差は右辺によってはもっと小さい。
κ は境界で 0 (Dirichlet) の 5 点差分ラプラシアン、1 辺 1000 点。固有値から κ = 4.06e5 (≈ (4/π²)(n+1)²、1 次元でも同じ値)。NumPy で計算した。
u は FP32 で 2^-24、FP64 で 2^-53。
FP32 で解いて FP64 で残差を補正する混合精度の反復改良もある。「FP32 では絶対に無理」ではない。

### 「尾崎スキーム」の噂

<div class="simple-box">

* 芝浦工大の尾崎克久先生らが考案した計算法 (**Ozaki scheme**)
* CUDA 13 の cuBLAS に入って、GeForce でも FP64 の行列積を**速く、しかも高精度に**計算できるようになった……らしい

</div>

<div class="highlight-box">

本当? 手元の RTX 5080 で確かめた

</div>

<div class="simple-box dense">

* 行列積そのものと、答えが式で書ける 2D 熱方程式を解く
* GPU FP64、GPU Ozaki、CPU で、速さと精度を比べる

</div>

Note:
所属は KAKEN の研究者情報 (2020〜2025 年度の課題) で芝浦工業大学 システム理工学部 教授。確認日 2026-11-21。
Ozaki-I は Ozaki・Ogita・Oishi・Rump (2012)、Ozaki-II は Ozaki・Uchino・Imamura (2025)。
「答えが式で書ける」は PDE の解析解ではなく、差分スキームの離散厳密解。比べると丸め誤差だけが残る (離散化誤差は約 1e-5 で、丸め誤差よりずっと大きい)。

### 低精度の速い演算器で FP64 を組み立てる

<div class="simple-box">

* AI 向けの Tensor Core (INT8 / FP16 / FP8) は、小さな数の行列積がとても速い
* 小さな整数どうしの積と和は、桁あふれしなければ**誤差ゼロ**
* FP64 の行列積を、誤差の出ない小さな行列積に分解 = **Ozaki&nbsp;scheme**

</div>

<div class="results-box dense nowrap-table">
<table>
<tr><th></th><th>分け方</th><th>行列積の回数</th></tr>
<tr><td>Ozaki-I (2012〜)</td><td>仮数を数ビットずつ切る (筆算)</td><td>切った数の 2 乗に比例</td></tr>
<tr><td>Ozaki-II (2025〜)</td><td>整数 (法) で割った余りに分ける</td><td>法の数に比例</td></tr>
</table>
</div>

Note:
Ozaki-I は 2012 年の Ozaki・Ogita・Oishi・Rump。INT8 Tensor Core 版は Ootomo・Ozaki・Yokota (2024)。
Ozaki-II は Ozaki・Uchino・Imamura (arXiv 2025、IJHPCA 2026)。
筆算のたとえ: 1234 × 5678 を 2 桁ずつに分けると、部分積は小さい数どうしの掛け算になる。

<div class="simple-box dense">

孫子算経 (3〜5 世紀): 「3 で割ると 2、5 で割ると 3、7 で割ると 2 余る数は?」

* 3 × 5 × 7 = 105 未満に、答えはただ 1 つ: **23** (中国式剰余定理)
* 行列積の 1 要素 3 × 5 + 4 × 2 も、余りだけで計算できる
* 3 で割った余りなら 0 × 2 + 1 × 2 = **2**。5 と 7 なら **3** と **2**

</div>

Note:
孫子算経 巻下の「物不知数」の問題 (原文「今有物不知其數。三三數之賸二、五五數之賸三、七七數之賸二。問物幾何。」答 23)。成立は 3〜5 世紀ごろで諸説ある。この種の問題の知られている最古の例 (MacTutor)。
孫子の解き方: 3 の余り 1 につき 70、5 の余り 1 につき 21、7 の余り 1 につき 15 を置いて足し、105 を引く。2 × 70 + 3 × 21 + 2 × 15 = 233、233 − 210 = 23。
70・21・15 は「自分の法で割ると 1 余り、ほかの法では割り切れる数」。Ozaki-II 論文の式 (9) の CRT の公式と同じ形。和算では「百五減算」と呼ぶ (国立国会図書館「江戸時代の数学」)。
各法での行列積は INT8 の入力・INT32 の足し合わせなので、桁あふれしない限り誤差ゼロ (論文では内側の次元が 2^17 未満)。
誤差が入るのは主に「入力を整数に丸めるとき」と「結果を FP64 に戻すとき」。
cuBLAS の復元はカーネル名 (inverse_scaling_mrc_kernel) から混合基数変換 (MRC) と推定。論文の Algorithm 1 は式 (9) の公式を使う。どちらも同じ数に戻る。
ステップごとの解説は Wiki の「中国剰余定理」のページ。

### CUDA 13 の cuBLAS で使える

<pre style="width: 100%; font-size: 0.8em;"><code class="language-bash" data-trim>
export CUBLAS_EMULATE_DOUBLE_PRECISION=1
export CUBLAS_EMULATION_STRATEGY=performant
python my_simulation.py
</code></pre>

<div class="simple-box dense">

* プログラムを書き換えずに、cuBLAS の FP64 行列積 (DGEMM) が Ozaki になる。CuPy などからもそのまま
* performant: 得なときだけ使う (既定)、eager: 使えるときはいつも使う
* CUDA 13.0 Update 2 で Ozaki-I、13.4 で Ozaki-II が入った。GeForce なら RTX&nbsp;30&nbsp;/&nbsp;40&nbsp;/&nbsp;50 が対象
* **CUDA 13 に上げただけでは使われない** (環境変数で opt-in)

</div>

Note:
cuBLAS のドキュメント: FP64 の fixed-point emulation は compute capability 8.x、9.0、10.x、11.0、12.x、CUDA 13.0u2 以降。13.4 のリリースノート: Ozaki-II は Ampere 以降で、Ozaki-I より速いときに使う。
RTX 5080 では、エミュレーションが効いたときはいつも Ozaki-II が選ばれた (Nsight Systems で確認)。
N = 512 では performant が FP64 のままになり、eager で強制すると 2.4 倍速かった (Appendix)。
cuSOLVER (LU など) はこの環境変数では切り替わらない。ハンドルごとに API で指定する (結果の章)。
注意: CUDA 13.5 のリリースノートに、C と D の leading dimension が違うときや split-K のときに誤った結果を返しうる既知の問題 (13.0u2 から) が載っている。今回の測定は誤差を毎回測っていて、異常は出ていない。

### 誤差の物差し

<div class="simple-box">

* 単位は $u = 2^{-53} \approx 1.1 \times 10^{-16}$ (FP64 で 1 回丸めるときの最大相対誤差、肩の53はFP64の仮数部の長さ)
* **行列積**: 256 要素を選び、誤差なしの積と正確な総和で「正しく丸めた答え」を作って比べる
* **熱方程式**: 初期条件を正弦波の重ね合わせにすると、差分スキームの答えが式で書ける → ずれは丸め誤差だけ

</div>

<div class="highlight-box">

0u なら「FP64 で正しく丸めた答え」と一致<br>1u は、桁落ちがないときの丸め 1 回分

</div>

Note:
行列積の誤差は |c − c_exact| / (|A||B|) を u 単位で表したもの。誤差なしの積は Dekker の TwoProduct、総和は math.fsum。
有理数演算で求めた真値とビット単位で一致することを確認済み。
c_exact は「正しく丸めた答え」そのものなので、0u はそれとビット単位で同じという意味。
1u は、(|A||B|) の大きさの数を 1 回丸めたときの最大のずれ。足し合わせで打ち消し (桁落ち) があると、答え c は (|A||B|) より小さいので、c に対する相対誤差は 1u より大きくなる。
だから 1u 未満でも「正しく丸めた答えとほぼ同じ」とは言えない。NumPy は N = 16000 で 0.20u だが、要素ごとの相対誤差は最大 2.2e-13 (results/cpu-numpy/)。
NumPy や Eigen も同じ物差しで測るので、CPU の FP64 と直接比べられる。

### この実験の注意点

<div class="simple-box dense">

* ADI の密行列 M は、行列積を取り出すための**模型**。実際の陰解法は $O(N^2)$ の三重対角ソルバで解く。測ると N = 8192 で 16 ms、**GPU Ozaki の密行列 (169.5 ms) より 11&nbsp;倍速い** (FP64 のままなら 171 倍)
  * 問題の構造に合わせたソルバを使えば、必ずしも Ozaki が優位とは限らない。Ozaki はあくまで**密行列の積 (DGEMM) が得意な手法**
* 熱方程式は離散化誤差 (約 $10^{-5}$) が FP64 の丸め誤差 (約 $10^{-13}$) よりずっと大きい。**Ozaki で丸め誤差が減っても、解の精度は変わらない**。ここでは「丸め誤差だけを測る物差し」として使った
* RTX 5080 1 枚だけ。計測回数は少なめ (行列積 3〜5 回、熱方程式 1〜3 回)、GPU クロックは固定していない

</div>

Note:
離散化誤差は 5.4e-6〜7.5e-6、GPU FP64 の丸め誤差は最大 2.0e-13、Ozaki は最大 7.3e-15 (results/)。どちらでも、連続な解とのずれは離散化誤差で決まる。
想定質問「なら FP32 で解けば?」→「予備の確認では、FP32 だと丸め誤差のほうが離散化誤差より大きくなった。三重対角ソルバで 9.5e-5〜1.4e-3 (離散化誤差の 18〜186 倍)、伝播行列で 9.3e-6〜1.5e-5 (1.3〜2.2 倍)。解く行列の条件数が 1/h² で大きくなるので、格子を細かくするほど FP32 は苦しい」。
この FP32 の値は予備の確認 (2026-11-22): CPU の NumPy / SciPy、N = 1024 / 2048 / 4096、同じ dt・ステップ数・離散厳密解、1 回だけの実行。リポジトリに入れていない使い捨てのスクリプトで、GPU と N = 8192 では測っていない。スライドの本文に出すなら、results-adi/ に測定を足してから。
想定質問「三重対角ソルバで解けば?」→「この問題ならそのとおりで、測ると 11 倍速い。Ozaki は構造 (疎・帯) を使えない密行列のための技術で、密行列との差を 171 倍から 11 倍に縮める」(Appendix)。
計測回数の内訳 (聞かれたら): GPU は行列積 5 回、熱方程式 3 回。CPU は行列積 3 回 (Eigen、NumPy)、熱方程式 1 回 (Eigen。results/cpu-eigen/pde.json の repeats)。ADI のソルバ比較 (results-adi/) は 3 回。
results-adi/ (2026-11-22)。同じ ADI (同じ格子、時間刻み、離散厳密解) を、ソルバだけ替えて測った。三重対角は自前の Thomas 法カーネル 15.7 ms、密な伝播行列は FP64 2689 ms、Ozaki 169.5 ms。

### どんな計算に効く?

<div class="results-box nowrap-first">
<table>
<tr><th></th><th>大きな密行列積が主</th><th>それ以外</th></tr>
<tr><td>FP64 が要る</td><td><b>Ozaki の本命</b><br>量子化学 (SCF など)<br>統計力学 (格子モデルなど)<br>密な連立方程式 (境界要素法など)</td><td>速くならない<br>ステンシル、疎行列</td></tr>
<tr><td>FP32 で足りる</td><td>深層学習 (低精度で回す)</td><td>FP32 で回す</td></tr>
</table>
</div>

<div class="simple-box dense">

* NVIDIA の量子化学ライブラリ cuEST は Ozaki scheme を使う (らしい)
* 偏微分方程式でも、**密行列が出る解法** (スペクトル法、境界要素法など) なら効く見込み。未検証だけど、試したい例題は山ほどある！

</div>

Note:
統計力学の例 (聞かれたら): 2D イジング模型の転送行列法。幅 L の帯なら転送行列 T は 2^L × 2^L で、要素がすべて正の密行列。分配関数 Z = Tr T^M を、T の 2 乗を繰り返して計算すれば DGEMM になる。テンソル繰り込み群 (TRG / HOTRG) も、テンソルの縮約は行列積。
ただし、同じ問題でも解き方で変わる。最大固有値だけをべき乗法で求めるなら行列とベクトルの積 (メモリ律速) で、SVD や固有値分解の部分は速くなりにくい (固有値は 1.4 倍)。モンテカルロ法 (メトロポリス法) は局所的なスピン反転で行列積が出ない (ステンシルと同じ側)。どれも今回は測っていない。
偏微分方程式を差分や有限要素で離散化した行列は疎行列で、今回の熱方程式も実用では三重対角ソルバのほうが速い (注意点のスライド)。密行列が出るのは、スペクトル選点法 (微分の行列が密)、境界要素法、疎行列の直接法の中のフロント行列など。どれも今回は測っていない。
cuEST のドキュメント: 密度フィッティングの交換項 (DF-K) で、速いと見込まれるときに fixed-point (Ozaki-I または II) を使う。CUDA 13.0.2 以降。
FP32 で足りる例 (入れるかは要相談): ECMWF は 2021 年の IFS Cycle 47r2 で HRES と ENS の予報を単精度にした (計算資源の約 4 割を捻出)。ただし解析 (データ同化) は倍精度のままで、行列の逆行列計算など一部の処理も倍精度が要る。
悪条件の正規方程式などは、行列積を FP64 相当にしても直らない (条件数が 2 乗になるのが原因)。精度が要るならアルゴリズム側 (QR、反復改良) で対処する。

Note:
リンク先は尾崎先生の講義資料 (参考文献 8)。Ozaki のエミュレーションを使ったブロック Cholesky の性能と残差 (スライド 105〜106) と、cuSOLVER の各ルーチンの性能比の表 (スライド 109、RTX 5060 Ti) が載っている。
疎行列の直接法: supernodal / multifrontal 法では、フロント行列の密な分解と更新が計算の大半を占める。
INT8 の縮小の出典: NVIDIA の HGX のページ (参考文献 7 の HGX Platform) の表で、INT8 Tensor Core は HGX B200 が 72 POPS、HGX B300 が 3 POPS (どちらも 8 GPU のボードで sparse の値。dense はその半分)。1 GPU の dense に直すと 4.5 POPS → 0.19 POPS で、約 1/24。同じ表で FP8/FP6 は両方 72 PFLOPS (sparse)、FP4 の dense は 72 → 108 PFLOPS。次の世代の Rubin GPU は、INT8 250 TOPS (dense) に対して NVFP4 推論 50 PFLOPS。確認日 2026-11-22。
尾崎先生の講義資料 (参考文献 8、スライド 117) も同じ表を引いて、「B300 以降では重心が NVFP4 / FP8 側へ移っている」と書いている。
FP8 版 Ozaki-I は Mukunoki (2025、arXiv:2508.00441)。RTX 5060 Ti で FP64 命令を使わずに DGEMM をエミュレートしている。

### まとめ

<div class="summary-list">

1. GeForce の FP64 は FP32 の 1/64。RTX 5080 でも CPU の 2.5 倍どまり
2. CUDA 13 の Ozaki scheme (わずかな環境変数で有効) で、FP64 の行列積が **19 倍** (CPU の 48 倍)。誤差はむしろ小さい

4. **密行列が出る物理の計算なら、役に立つ例はいっぱい見つけられそう**。今回の熱方程式は、丸め誤差を測るための例題として解いた

Note:
results-adi/ (2026-11-22、ドライバ 595.99.02)。同じ Peaceman–Rachford ADI、dt = 1e-4、20 ステップの中央値 (3 回)。Ozaki は performant と eager の速いほう。
自前の Thomas 法は、格子の 1 線に 1 スレッドを割り当てる素直な CUDA カーネル (係数が全線で共通なことだけ使った。チューニングはしていない)。cuSPARSE は gtsv2_nopivot と gtsv2 の速いほう。
三重対角は O(N²)、密行列は O(N³)。伝播行列の Ozaki は、cuSPARSE より N ≤ 4096 で速く、8192 で 1.5 倍遅い。
密な LU は、I − aL と I + aL を一般の密行列として扱い、getrf は最初に 1 回、毎ステップ行列積 2 回 + getrs 2 回 (右辺 N 本)。GPU FP64 では 15 / 102 / 726 / 5536 ms で、Ozaki で 8.0 倍 (N = 8192)。
ただし三重対角行列を密行列として getrf しても Ozaki は効かない (497.6 → 473.3 ms)。Nsight Systems で見ると、行列積の 77〜78% がエミュレーションの中で FP64 に戻っていた。右辺が密な getrs は 5.3 倍になる。
丸め誤差 (離散厳密解との相対誤差、N = 8192): 三重対角 1.7e-11、cuSPARSE 3.4e-12、密な LU 1.7e-11。A の条件数 (約 1.3 万) が効く。伝播行列 (固有分解の式から作った M) は FP64 2.0e-13、Ozaki 7.3e-15 だが、M を LU で作ると 2.9e-11 になる。どれも離散化誤差 (7.5e-6) よりずっと小さい。
三重対角ソルバは 3 条件で同じ時間 (0.98〜1.01 倍)。cuSPARSE の N = 2048 だけ、エミュレーション条件の通し実行で 0.80 倍になったが、単独で流すと両条件とも 14.2 ms だった。

    // Footer of every slide: chapter name, progress bar and page number.
    // A chapter starts at a slide carrying data-chapter and runs up to the
    // next one. The slide with data-appendix starts the appendix, which shows
    // its chapter name only; pages are counted over the main part.
    function buildFooters(deck) {
      const slides = deck.getSlides();
      const appendixStart = slides.findIndex((s) => s.hasAttribute('data-appendix'));
      const mainCount = appendixStart >= 0 ? appendixStart : slides.length;

      const chapters = [];
      slides.forEach((slide, index) => {
        if (slide.dataset.chapter) {
          chapters.push({ name: slide.dataset.chapter, start: index });
        }
      });
      chapters.forEach((chapter, k) => {
        const next = k + 1 < chapters.length ? chapters[k + 1].start : slides.length;
        chapter.end = next - 1;
      });
      const mainChapters = chapters.filter((c) => c.start < mainCount);

      slides.forEach((slide, index) => {
        if (slide.classList.contains('title-slide') || slide.classList.contains('divider')) {
          return;
        }
        const chapter = chapters.filter((c) => c.start <= index).pop();
        const footer = document.createElement('div');
        footer.className = 'slide-footer';

        const name = document.createElement('span');
        name.className = 'footer-chapter';
        name.textContent = chapter ? chapter.name : '';
        footer.appendChild(name);

        if (index < mainCount) {
          const bar = document.createElement('span');
          bar.className = 'footer-progress';
          bar.setAttribute('aria-hidden', 'true');
          mainChapters.forEach((c) => {
            const last = Math.min(c.end, mainCount - 1);
            const segment = document.createElement('span');
            segment.style.flex = `${last - c.start + 1} 1 0px`;
            if (last < index) {
              segment.className = 'done';
            } else if (c.start <= index) {
              segment.className = 'current';
              const fill = document.createElement('span');
              fill.style.width = `${(100 * (index - c.start + 1)) / (last - c.start + 1)}%`;
              segment.appendChild(fill);
            }
            bar.appendChild(segment);
          });
          footer.appendChild(bar);

          const page = document.createElement('span');
          page.className = 'footer-page';
          page.textContent = `${index + 1} / ${mainCount}`;
          footer.appendChild(page);
        }

        slide.appendChild(footer);
      });
    }

    Reveal.on('ready', () => buildFooters(Reveal));

  </script>
